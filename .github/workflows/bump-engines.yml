name: Bump inference engines

# Weekly: advances each Bemly engine submodule to origin/main, builds, smoke-tests,
# and opens a PR. Nothing merges without human review.

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Advance submodules to Bemly main tips
        id: bump
        run: |
          changed=
          for path in vendor/llama.cpp vendor/stable-diffusion.cpp vendor/audio.cpp; do
            name=$(basename "$path")
            git submodule update --init --depth 1 "$path"
            before=$(git -C "$path" rev-parse HEAD)
            git -C "$path" fetch --depth 1 origin main
            git -C "$path" checkout -q FETCH_HEAD
            after=$(git -C "$path" rev-parse HEAD)
            echo "$name: ${before:0:9} -> ${after:0:9}"
            if [ "$before" != "$after" ]; then
              git add "$path"
              changed=1
            fi
          done
          if [ -z "$changed" ]; then
            echo "updated=false" >> "$GITHUB_OUTPUT"
            echo "Already up to date"
          else
            echo "updated=true" >> "$GITHUB_OUTPUT"
            {
              echo "### Submodule tips"
              git submodule status
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build engines (native arch, for smoke test)
        if: steps.bump.outputs.updated == 'true'
        run: ./scripts/build-engines.sh

      - name: Smoke test — real inference on CPU
        if: steps.bump.outputs.updated == 'true'
        run: |
          BIN=vendor/llama.cpp/build-static/bin/llama-server
          "$BIN" --version
          curl -sL -o /tmp/tiny.gguf \
            "https://huggingface.co/Qwen/Qwen3-0.6B-GGUF/resolve/main/Qwen3-0.6B-Q8_0.gguf"
          "$BIN" -m /tmp/tiny.gguf -ngl 0 -c 512 --port 8088 --host 127.0.0.1 &
          SERVER=$!
          for i in $(seq 1 60); do
            curl -s http://127.0.0.1:8088/health | grep -q ok && break
            sleep 2
          done
          RESPONSE=$(curl -s http://127.0.0.1:8088/v1/chat/completions \
            -H "Content-Type: application/json" \
            -d '{"messages":[{"role":"user","content":"Say OK"}],"max_tokens":20}')
          kill $SERVER || true
          echo "$RESPONSE" | grep -q '"content"' || { echo "smoke test FAILED"; exit 1; }
          echo "smoke test OK"

      - name: Run app unit tests
        if: steps.bump.outputs.updated == 'true'
        run: swift test

      - name: Open pull request
        if: steps.bump.outputs.updated == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          branch: bump/engines
          title: "Bump Bemly engine submodules"
          commit-message: "Bump Bemly engine submodules to latest main"
          body: |
            Automated inference engine submodule update.

            - Submodules advanced to Bemly `main` tips
            - Static build: OK
            - Smoke test (model load + real inference): OK
            - Unit tests: OK

            Review and merge manually. FA/ToshGEMM stay on the fork — do not
            reintroduce a patches/ overlay.
          add-paths: |
            vendor/llama.cpp
            vendor/stable-diffusion.cpp
            vendor/audio.cpp
